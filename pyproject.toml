[project]
name = "blog-management-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SaquibAnjum", email = "saquib1312@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-bcrypt>=1.0.1",
    "flask-cors>=6.0.5",
    "flask-jwt-extended>=4.7.4",
    "flask-sqlalchemy>=3.1.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
blog-management-api = "blog_management_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
